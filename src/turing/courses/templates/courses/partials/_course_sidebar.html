{% comment %} Sidebar para la sección de cursos (profesor) {% endcomment %}
<aside class="sidebar">
    <div class="brand-title"><a href="/chatbot/" class="brand-link">Turing</a></div>
    <hr class="sidebar-divider">
    <ul class="nav-links">
        <li><a href="{% url 'teachers:dashboard' %}"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a class="{% if active_page == 'course_detail' %}active{% endif %}"
                href="{% url 'teachers:manage_course' course.id %}"><i class="fa-solid fa-layer-group"></i> Detalles del
                Curso</a></li>
    </ul>
    <hr class="sidebar-divider">
    <div class="sidebar-section">
        <h4 class="sidebar-title">{{ course.name }}</h4>
        <ul class="nav-links">
            <li><a class="{% if active_page == 'course_prompt' %}active{% endif %}"
                    href="{% url 'courses:prompt_edit' pk=course.id %}"><i class="fa-solid fa-wand-magic-sparkles"></i>
                    Prompt del Curso</a></li>
            <li><a class="{% if active_page == 'knowledge_base' %}active{% endif %}"
                    href="{% url 'courses:knowledge_base' course.id %}"><i class="fa-solid fa-database"></i> Base de
                    Conocimiento</a></li>
        </ul>
    </div>
</aside>
